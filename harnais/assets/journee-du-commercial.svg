<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="Montserrat, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="1200" height="400" rx="24" fill="#FAF9F7"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="24" fill="none" stroke="#E7E4DE"/>

  <rect x="40" y="44" width="8" height="8" fill="#000000"/>
  <text x="58" y="53" fill="#000000" fill-opacity="0.72" font-size="14" font-weight="600" letter-spacing="2.5">UNE JOURNÉE AVEC LE HARNAIS</text>
  <text x="40" y="96" fill="#000000" font-size="30" font-weight="800">Le harnais prépare. <tspan fill-opacity="0.45">Le commercial décide.</tspan></text>

  <g font-size="15">
    <!-- 1 -->
    <g transform="translate(40 130)">
      <rect width="250" height="210" rx="18" fill="#ffffff" stroke="#000000" stroke-width="2"/>
      <circle cx="38" cy="38" r="20" fill="#FFD34E" stroke="#000000" stroke-width="2"/>
      <text x="38" y="45" fill="#000000" font-size="18" font-weight="800" text-anchor="middle">1</text>
      <text x="70" y="45" fill="#000000" font-size="18" font-weight="800">Le point du matin</text>
      <text x="22" y="92" fill="#000000" fill-opacity="0.72">À qui parler aujourd'hui,</text>
      <text x="22" y="116" fill="#000000" fill-opacity="0.72">pourquoi maintenant,</text>
      <text x="22" y="140" fill="#000000" fill-opacity="0.72">avec quel prétexte.</text>
      <text x="22" y="184" fill="#000000" font-weight="700">La plus utile en premier.</text>
    </g>
    <!-- 2 -->
    <g transform="translate(330 130)">
      <rect width="250" height="210" rx="18" fill="#ffffff" stroke="#000000" stroke-width="2"/>
      <circle cx="38" cy="38" r="20" fill="#FFD34E" stroke="#000000" stroke-width="2"/>
      <text x="38" y="45" fill="#000000" font-size="18" font-weight="800" text-anchor="middle">2</text>
      <text x="70" y="45" fill="#000000" font-size="18" font-weight="800">L'échange</text>
      <text x="22" y="92" fill="#000000" fill-opacity="0.72">Rendez-vous, appel, visio</text>
      <text x="22" y="116" fill="#000000" fill-opacity="0.72">ou salon. Le commercial</text>
      <text x="22" y="140" fill="#000000" fill-opacity="0.72">parle, il ne saisit rien.</text>
      <text x="22" y="184" fill="#000000" font-weight="700">Coaching à la demande.</text>
    </g>
    <!-- 3 -->
    <g transform="translate(620 130)">
      <rect width="250" height="210" rx="18" fill="#ffffff" stroke="#000000" stroke-width="2"/>
      <circle cx="38" cy="38" r="20" fill="#FFD34E" stroke="#000000" stroke-width="2"/>
      <text x="38" y="45" fill="#000000" font-size="18" font-weight="800" text-anchor="middle">3</text>
      <text x="70" y="45" fill="#000000" font-size="18" font-weight="800">La captation</text>
      <text x="22" y="92" fill="#000000" fill-opacity="0.72">Le commercial raconte.</text>
      <text x="22" y="116" fill="#000000" fill-opacity="0.72">Compte rendu, SPICED</text>
      <text x="22" y="140" fill="#000000" fill-opacity="0.72">avec preuves, tâches.</text>
      <text x="22" y="184" fill="#000000" font-weight="700">Zéro saisie.</text>
    </g>
    <!-- 4 -->
    <g transform="translate(910 130)">
      <rect width="250" height="210" rx="18" fill="#0a0a0c"/>
      <circle cx="38" cy="38" r="20" fill="#FFD34E"/>
      <text x="38" y="45" fill="#000000" font-size="18" font-weight="800" text-anchor="middle">4</text>
      <text x="70" y="45" fill="#ffffff" font-size="18" font-weight="800">Le suivi à jour</text>
      <text x="22" y="92" fill="#ffffff" fill-opacity="0.8">Un seul go, et le suivi</text>
      <text x="22" y="116" fill="#ffffff" fill-opacity="0.8">est à jour. Chaque alerte</text>
      <text x="22" y="140" fill="#ffffff" fill-opacity="0.8">dit d'où elle vient.</text>
      <text x="22" y="184" fill="#FFD34E" font-weight="700">Nourrit le point de demain.</text>
    </g>
  </g>

  <path d="M292 235 L 326 235" stroke="#000000" stroke-width="2.5" marker-end="url(#p)"/>
  <path d="M582 235 L 616 235" stroke="#000000" stroke-width="2.5" marker-end="url(#p)"/>
  <path d="M872 235 L 906 235" stroke="#000000" stroke-width="2.5" marker-end="url(#p)"/>
  <path d="M1035 342 C 1035 384, 165 384, 165 344" fill="none" stroke="#000000" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#p)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
