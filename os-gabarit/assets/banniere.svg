<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="Montserrat, Helvetica, Arial, sans-serif">
  <rect width="1200" height="360" rx="24" fill="#FAF9F7"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="24" fill="none" stroke="#E7E4DE"/>

  <!-- logo LABK : LAB plein, K en contour -->
  <text x="64" y="88" fill="#000000" font-size="34" font-weight="800" letter-spacing="1">LAB<tspan fill="none" stroke="#000000" stroke-width="1.6">K</tspan></text>

  <!-- surtitre -->
  <rect x="64" y="122" width="8" height="8" fill="#000000"/>
  <text x="82" y="131" fill="#000000" font-size="15" font-weight="600" letter-spacing="2.5" fill-opacity="0.72">POUR LES TPE ET PME QUI VENDENT EN B2B</text>

  <!-- titre, deuxième partie en gris comme sur labk.fr -->
  <text x="64" y="192" fill="#000000" font-size="46" font-weight="800">L'OS de l'entreprise.</text>
  <text x="64" y="246" fill="#000000" fill-opacity="0.45" font-size="46" font-weight="800">Sa façon de vendre, écrite.</text>

  <!-- phrase de la proposition de valeur, soulignée en jaune -->
  <rect x="64" y="306" width="140" height="6" rx="3" fill="#FFD34E"/>
  <text x="64" y="292" fill="#000000" font-size="22" font-weight="600">La bonne personne, au bon moment, pour les bonnes raisons.</text>

  <!-- carte à droite, style des cartes de labk.fr -->
  <g transform="translate(880 54)">
    <rect width="252" height="252" rx="20" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="24" y="44" fill="#000000" font-size="18" font-weight="800">L'OS</text>
    <rect x="152" y="26" width="78" height="26" rx="13" fill="#000000"/>
    <text x="191" y="44" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">IA-Ready</text>

    <circle cx="126" cy="150" r="66" fill="none" stroke="#E7E4DE" stroke-width="2"/>
    <circle cx="126" cy="150" r="44" fill="none" stroke="#C5C5C5" stroke-width="2"/>
    <circle cx="126" cy="150" r="22" fill="#FFD34E" stroke="#000000" stroke-width="2"/>
    <circle cx="126" cy="150" r="6" fill="#000000"/>
    <text x="126" y="236" fill="#000000" fill-opacity="0.58" font-size="13" font-weight="600" text-anchor="middle">la clarté avant l'accélération</text>
  </g>
</svg>
