<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Montserrat, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pointe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
    <marker id="pointe-gris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="24" fill="#FAF9F7"/>
  <rect x="0.5" y="0.5" width="1199" height="559" rx="24" fill="none" stroke="#E7E4DE"/>

  <!-- colonne LABK, carte sombre comme sur labk.fr -->
  <rect x="40" y="40" width="300" height="480" rx="20" fill="#0a0a0c"/>
  <text x="190" y="88" fill="#ffffff" font-size="26" font-weight="800" letter-spacing="1" text-anchor="middle">LAB<tspan fill="none" stroke="#ffffff" stroke-width="1.4">K</tspan></text>
  <text x="190" y="118" fill="#ffffff" fill-opacity="0.72" font-size="13" text-anchor="middle">deux dépôts privés, les mêmes pour tous</text>

  <rect x="70" y="150" width="240" height="130" rx="16" fill="#1a1a1e" stroke="#3a3a40"/>
  <text x="190" y="196" fill="#ffffff" font-size="17" font-weight="800" text-anchor="middle">labk-os_entreprise</text>
  <text x="190" y="226" fill="#ffffff" fill-opacity="0.72" font-size="15" text-anchor="middle">le gabarit vide</text>
  <text x="190" y="250" fill="#ffffff" fill-opacity="0.72" font-size="15" text-anchor="middle">de l'OS</text>

  <rect x="70" y="320" width="240" height="160" rx="16" fill="#1a1a1e" stroke="#3a3a40"/>
  <text x="190" y="366" fill="#ffffff" font-size="17" font-weight="800" text-anchor="middle">labk-harnais_commercial</text>
  <text x="190" y="396" fill="#ffffff" fill-opacity="0.72" font-size="15" text-anchor="middle">les skills et</text>
  <text x="190" y="420" fill="#ffffff" fill-opacity="0.72" font-size="15" text-anchor="middle">les règles LABK</text>
  <text x="190" y="456" fill="#FFD34E" font-size="13" font-weight="700" text-anchor="middle">nouvelle version = mise à jour</text>

  <!-- colonne client -->
  <rect x="480" y="40" width="680" height="480" rx="20" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="510" y="72" width="8" height="8" fill="#000000"/>
  <text x="528" y="81" fill="#000000" fill-opacity="0.72" font-size="14" font-weight="600" letter-spacing="2.5">CHEZ LE CLIENT</text>

  <!-- OS -->
  <rect x="510" y="110" width="290" height="140" rx="16" fill="#FAF9F7" stroke="#000000" stroke-width="2"/>
  <text x="530" y="148" fill="#000000" font-size="24" font-weight="800">os</text>
  <text x="530" y="178" fill="#000000" font-size="15" font-weight="700">appartient à l'entreprise</text>
  <text x="530" y="204" fill="#000000" fill-opacity="0.58" font-size="14">offre, ICP, parcours client,</text>
  <text x="530" y="226" fill="#000000" fill-opacity="0.58" font-size="14">règles, constats du terrain</text>

  <!-- CRM -->
  <g transform="translate(860 110)">
    <path d="M0 18 L0 122 A135 18 0 0 0 270 122 L270 18" fill="#FAF9F7" stroke="#000000" stroke-width="2"/>
    <ellipse cx="135" cy="18" rx="135" ry="18" fill="#FAF9F7" stroke="#000000" stroke-width="2"/>
    <text x="135" y="74" fill="#000000" font-size="24" font-weight="800" text-anchor="middle">CRM</text>
    <text x="135" y="102" fill="#000000" fill-opacity="0.58" font-size="14" text-anchor="middle">les faits de l'entreprise</text>
  </g>

  <!-- harnais -->
  <rect x="510" y="290" width="620" height="200" rx="16" fill="#FFD34E" fill-opacity="0.22" stroke="#000000" stroke-width="2"/>
  <text x="530" y="328" fill="#000000" font-size="24" font-weight="800">harnais</text>
  <text x="530" y="362" fill="#000000" font-size="15" font-weight="700">appartient</text><text x="530" y="384" fill="#000000" font-size="15" font-weight="700">au commercial</text>

  <rect x="660" y="350" width="210" height="110" rx="14" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="765" y="386" fill="#000000" font-size="19" font-weight="800" text-anchor="middle">base</text>
  <text x="765" y="414" fill="#000000" fill-opacity="0.58" font-size="14" text-anchor="middle">vient de LABK,</text>
  <text x="765" y="436" fill="#000000" fill-opacity="0.58" font-size="14" text-anchor="middle">se met à jour</text>

  <rect x="900" y="350" width="210" height="110" rx="14" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="1005" y="386" fill="#000000" font-size="19" font-weight="800" text-anchor="middle">personnel</text>
  <text x="1005" y="414" fill="#000000" fill-opacity="0.58" font-size="14" text-anchor="middle">réglages et wiki,</text>
  <text x="1005" y="436" fill="#000000" fill-opacity="0.58" font-size="14" text-anchor="middle">jamais touchés</text>

  <!-- liens de lecture -->
  <path d="M730 350 L 690 256" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#pointe-gris)"/>
  <text x="722" y="304" fill="#000000" fill-opacity="0.58" font-size="13">lit</text>
  <path d="M820 350 L 930 256" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#pointe-gris)"/>
  <text x="884" y="304" fill="#000000" fill-opacity="0.58" font-size="13">lit, écrit après le go</text>

  <!-- flux LABK vers le client -->
  <path d="M310 215 C 400 215, 420 180, 506 180" fill="none" stroke="#000000" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#pointe)"/>
  <rect x="352" y="132" width="110" height="44" fill="#FAF9F7"/>
  <text x="407" y="150" fill="#000000" fill-opacity="0.72" font-size="13" text-anchor="middle">copié une fois,</text>
  <text x="407" y="168" fill="#000000" fill-opacity="0.72" font-size="13" text-anchor="middle">à l'installation</text>
  <path d="M310 445 L 656 445" fill="none" stroke="#000000" stroke-width="2.5" marker-end="url(#pointe)"/>
  <rect x="518" y="420" width="130" height="20" fill="#FBF1C9"/>
  <text x="583" y="435" fill="#000000" fill-opacity="0.72" font-size="13" text-anchor="middle">à chaque version</text>
</svg>
